# Identificação do projeto
sonar.projectKey=jokenpoke-backend
sonar.projectName=JokenPoke Backend
sonar.projectVersion=1.0
 
# Fontes
sonar.sources=app
sonar.tests=tests
sonar.language=py
 
# Cobertura de testes
# Gerado pelo pytest-cov: pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
 
# Relatório de testes (JUnit XML)
# Gerado pelo pytest: pytest --junitxml=test-results.xml
sonar.python.xunit.reportPath=test-results.xml
 
# Encoding
sonar.sourceEncoding=UTF-8
 
# Exclusões
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/** 