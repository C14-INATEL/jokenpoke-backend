events {
    worker_connections 1024;
}

http {

    # Configurações globais
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Tamanho máximo de upload
    client_max_body_size 50M;

    # Upstream services
    upstream api {
        server api:8000;
    }

    upstream jenkins {
        server jenkins:8080;
        keepalive 32;
    }

    upstream sonarqube {
        server sonarqube:9000;
    }

    # API — localhost:80/api
    server {
        listen 80;
        server_name localhost;

        # Proxy para a API FastAPI
        location /api/ {
            proxy_pass         http://api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Proxy para o Jenkins
        location /jenkins/ {
            proxy_pass         http://jenkins/jenkins/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket do Blue Ocean / pipeline console
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # Proxy para o SonarQube
        location /sonar/ {
            proxy_pass         http://sonarqube/sonar/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check do próprio Nginx
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}