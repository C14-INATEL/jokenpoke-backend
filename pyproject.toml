[tool.poetry]
package-mode = false

[project]
name = "jokenpoke-game-api"
version = "0.1.0"
description = "Multiplayer card battle API"

authors = [
    {name = "Matheus Netto", email = "netto.matheus123@outlook.com"}
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "pytest-watch (>=4.2.0,<5.0.0)"
]

# =========================================================
# RUFF
# =========================================================

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "S",
]

ignore = [
    "E501",
    "S101",
    "B008",
]

fixable = ["ALL"]

unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S105",
    "S101"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# =========================================================
# PYTEST
# =========================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]