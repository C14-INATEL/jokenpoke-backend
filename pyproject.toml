[tool.poetry]
package-mode = false

[project]
name = "jokenpoke-game-api"
version = "0.1.0"
description = "Multiplayer card battle API"

authors = [
    {name = "Matheus Netto", email = "netto.matheus123@outlook.com"}
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "dulwich (>=1.2.5,<2.0.0)",
    "python-multipart (>=0.0.30,<0.0.31)",
    "bcrypt (>=5.0.0,<6.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "httpx>=0.27.0,<0.30.0",
    "ruff>=0.4.0",
    "pytest-watcher>=0.4.0",
    "mypy>=1.10.0,<3.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit (>=1.9.4,<2.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "httpx2 (>=2.3.0,<3.0.0)",
]

loadtest = [
    "locust (>=2.44.0,<3.0.0)"
]

# =========================================================
# MYPY
# =========================================================

[tool.mypy]
python_version = "3.12"

explicit_package_bases = true
ignore_missing_imports = true

exclude = [
    "tests/",
]

warn_return_any = false
warn_unused_configs = true

disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.*",
    "app.interfaces.*",
    "app.core.config",
]
ignore_errors = true

# =========================================================
# RUFF
# =========================================================

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "S",
]

ignore = [
    "E501",
    "S101",
    "B008",
]

fixable = ["ALL"]

unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S105",
    "S101"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# =========================================================
# PYTEST
# =========================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]