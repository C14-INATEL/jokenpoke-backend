services:

  # ========================================
  # API
  # ========================================
  api:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: jokenpoke-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  # ========================================
  # REVERSE PROXY
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: jokenpoke-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - jenkins
      - sonarqube
    restart: always
 
  # ========================================
  # CI/CD
  # ========================================
  jenkins:
    image: ${DOCKER_HUB_USER}/jokenpoke-jenkins:latest
    pull_policy: always   # força pull mesmo se já existe localmente
    container_name: jokenpoke-jenkins
    # Acesso direto ainda disponível caso necessário
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "0"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Permite ao Jenkins acessar o sonar-project.properties do projeto
      - .:/workspace:ro
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.model.DirectoryBrowserSupport.CSP=
      # Informa ao Jenkins onde o SonarQube está (usado pelo plugin sonar)
      SONAR_HOST_URL: http://sonarqube:9000
    depends_on:
      - sonarqube
    restart: always
 
  # ========================================
  # QUALIDADE DE CÓDIGO
  # ========================================
  sonarqube:
    image: sonarqube:community
    container_name: jokenpoke-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      # Disponibiliza as configurações do projeto dentro do container
      - ./docker/sonarqube/sonar-project.properties:/opt/sonarqube/conf/sonar-project.properties:ro
    ulimits:
      # Requisito mínimo do Elasticsearch embutido no SonarQube
      nofile:
        soft: 65536
        hard: 65536
    restart: always

  # ========================================
  # TUNNEL
  # ========================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: jokenpoke-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: "http --domain=${NGROK_DOMAIN} jenkins:8080"
    ports:
      - "4040:4040"
    depends_on:
      - jenkins
    restart: always
 
volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: